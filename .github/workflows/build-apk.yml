name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Accept licenses (fallback)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b94096449a3cbafb0456c33d02e\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew executable
        run: chmod +x gradlew || true

      - name: Build signed debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          fi
          # جلوگیری از اینکه Gradle پوشه پروژه را به‌عنوان SDK ببیند
          rm -f local.properties
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          elif [ -d /usr/local/lib/android/sdk ]; then
            echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
            export ANDROID_HOME=/usr/local/lib/android/sdk
            export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          fi
          cat local.properties || true
          set +e
          bash gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          CODE=${PIPESTATUS[0]}
          set -e
          tail -150 /tmp/build.log
          exit $CODE

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FamilyFund-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
